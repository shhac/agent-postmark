name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build binaries
        run: |
          go build -buildvcs=false -o agent-postmark ./cmd/agent-postmark
          go build -buildvcs=false -o mockpostmark ./cmd/mockpostmark
      - name: Subprocess e2e
        run: AGENT_POSTMARK_RUN_SUBPROCESS_E2E=1 go test ./internal/cli -run SubprocessE2E -count=1
